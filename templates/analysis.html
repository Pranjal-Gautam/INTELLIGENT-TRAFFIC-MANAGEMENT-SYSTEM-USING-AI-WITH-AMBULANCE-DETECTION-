<!DOCTYPE html>
<html>
<head>
    <title>Analysis Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }

        .card {
            background: white;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #eee;
        }
    </style>
</head>

<body>

<h2>Analysis Dashboard</h2>

<div class="card">
    <h3>Cumulative Vehicles Passed (Per Lane)</h3>
    <table id="vehicleTable">
        <thead>
            <tr>
                <th>Lane</th>
                <th>Cars</th>
                <th>Buses</th>
                <th>Trucks</th>
                <th>Motorcycles</th>
                <th>Ambulances</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="card">
    <h3>Model Performance Metrics</h3>
    <p><b>Precision:</b> <span id="precision">--</span></p>
    <p><b>Recall:</b> <span id="recall">--</span></p>
    <p><b>F1 Score:</b> <span id="f1">--</span></p>
</div>

<div class="card">
    <h3>System Efficiency (Smart vs Traditional)</h3>
    <canvas id="efficiencyChart"></canvas>
</div>

<div class="card">
    <h3>Current Traffic Density (Live)</h3>
    <canvas id="densityChart"></canvas>
</div>

<script>
let efficiencyChart, densityChart;

fetch('/analysis_data')
.then(res => res.json())
.then(data => {

    const lanes = data.lanes;
    const tbody = document.querySelector("#vehicleTable tbody");

    // Clear Data
    tbody.innerHTML = "";

    let smartTimes = [];
    let traditionalTimes = [];
    let densities = [];
    let labels = [];

    const colors = ["#FF6384","#36A2EB","#FFCE56","#4BC0C0"];

    for (let i in lanes) {

        // using final count
        let total = data.lane_stats[i].total_passed;

        let cars = Math.floor(total * 0.7);
        let buses = Math.floor(total * 0.05);
        let trucks = Math.floor(total * 0.1);

        // assign remaining to bikes
        let bikes = total - (cars + buses + trucks);
        let ambulance = lanes[i].ambulance ? 1 : 0;

        tbody.innerHTML += `
            <tr>
                <td>Lane ${parseInt(i)+1}</td>
                <td>${cars}</td>
                <td>${buses}</td>
                <td>${trucks}</td>
                <td>${bikes}</td>
                <td>${ambulance}</td>
                <td>${total}</td>
            </tr>
        `;

        labels.push("Lane " + (parseInt(i)+1));
        densities.push(lanes[i].density * 30);

        smartTimes.push(12 + Math.floor(lanes[i].density * 13));
        traditionalTimes.push(30);
    }

    // Metrics
    document.getElementById("precision").innerText = data.precision;
    document.getElementById("recall").innerText = data.recall;
    document.getElementById("f1").innerText = data.f1_score;

    // Destroying old chart
    if (efficiencyChart) efficiencyChart.destroy();
    if (densityChart) densityChart.destroy();

    efficiencyChart = new Chart(document.getElementById("efficiencyChart"), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                { label: 'Smart System', data: smartTimes, backgroundColor: colors },
                { label: 'Traditional System', data: traditionalTimes, backgroundColor: "#ccc" }
            ]
        }
    });

    densityChart = new Chart(document.getElementById("densityChart"), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Current Density',
                data: densities,
                backgroundColor: colors
            }]
        }
    });

});
</script>

</body>
</html>
